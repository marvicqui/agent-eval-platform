# Fast, deterministic CI: lint, types, unit tests. Zero LLM calls, zero
# cloud credentials — this must stay runnable on any fork.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans the commit range; a shallow clone lacks the
          # parent commit and makes the scan fail on "unknown revision".
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --dev
      - name: Lint
        run: uv run ruff check src/ tests/ examples/
      - name: Types
        run: uv run mypy src/
      - name: Unit tests (no LLM calls)
        run: uv run pytest tests/ -v
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
